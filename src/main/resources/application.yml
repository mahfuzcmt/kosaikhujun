spring:
  application:
    name: kosaibari
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kosaibari}
    username: ${SPRING_DATASOURCE_USERNAME:kosaibari}
    password: ${SPRING_DATASOURCE_PASSWORD:kosaibari_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8082
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

kosaibari:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-only-for-local-dev-32bytes}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  otp:
    length: 4
    expiry-minutes: 5
  sms:
    api-key: ${SMS_API_KEY:0ffe1d6a29e4a4d1}
    secret-key: ${SMS_SECRET_KEY:a2185de9}
    sender-id: ${SMS_SENDER_ID:01844015757}
  cors:
    allowed-origins: ${KOSAIBARI_CORS_ALLOWED_ORIGINS:http://localhost:3001}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8082/api/uploads}
  bkash:
    base-url: ${BKASH_BASE_URL:https://tokenized.sandbox.bka.sh/v1.2.0-beta}
    app-key: ${BKASH_APP_KEY:0vWQuCRGiUX7EPVjQDr0EUAYtc}
    app-secret: ${BKASH_APP_SECRET:jcUNPBgbcqEDedNKdvE4G1cAK7D3hCjmJccNPZZBq96QIxxwAMEx}
    username: ${BKASH_USERNAME:01770618567}
    password: ${BKASH_PASSWORD:D7DaC<*E*eG}
    callback-url: ${BKASH_CALLBACK_URL:http://localhost:3001/payment/callback}

logging:
  level:
    root: INFO
    com.kosaibari: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

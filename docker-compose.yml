version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kosaibari-postgres
    environment:
      POSTGRES_DB: kosaibari
      POSTGRES_USER: kosaibari
      POSTGRES_PASSWORD: kosaibari_dev
    ports:
      - "5433:5432"
    volumes:
      - kosaibari_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosaibari"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kosaibari-redis
    ports:
      - "6380:6379"
    volumes:
      - kosaibari_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kosaibari-backend
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kosaibari
      SPRING_DATASOURCE_USERNAME: kosaibari
      SPRING_DATASOURCE_PASSWORD: kosaibari_dev
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: change-me-in-production-this-is-only-for-local-dev-32bytes
      KOSAIBARI_CORS_ALLOWED_ORIGINS: https://kosailagbe.com,https://www.kosailagbe.com,http://103.187.22.131:3001,http://localhost:3001
      BKASH_CALLBACK_URL: https://kosailagbe.com/payment/callback
      KOSAIBARI_UPLOAD_DIR: /app/uploads
      KOSAIBARI_UPLOAD_BASE_URL: https://kosailagbe.com/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://kosailagbe.com/api
    container_name: kosaibari-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  kosaibari_postgres_data:
  kosaibari_redis_data:
